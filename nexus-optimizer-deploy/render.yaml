services:
  - type: web
    name: nexus-optimizer
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OWNER_USERNAME
        value: synx121
      - key: OWNER_PASSWORD_HASH
        value: "scrypt$16384$8$1$Fd45Dq2F12/Z4B+rRhgCVQ==$JW1x8g3FBlmVe6VMHLVRflXyQIzYTWvDQ45ZqC4xg4HrHurVw7QRqRJuqZj9PxTMWyJV5irA7j5bnh+u/1Qm8A=="
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: ./data/nexus.db
    disk:
      name: nexus-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
